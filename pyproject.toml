[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconai"
version = "0.1.0"
description = "AI-powered reconnaissance orchestrator for authorized penetration testing"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "dnspython>=2.6.0",
    "httpx>=0.27.0",
    "python-whois>=0.9.0",
    "shodan>=1.31.0",
    "playwright>=1.44.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.4.0",
    "python-nmap>=0.7.1",
    "pyyaml>=6.0.1",
]

[project.scripts]
reconai = "reconai.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["reconai"]
